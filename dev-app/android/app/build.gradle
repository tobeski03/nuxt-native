apply plugin: 'com.android.application'

android {
    namespace 'com.nuxtnative.prototype'
    compileSdk 36

    defaultConfig {
        applicationId 'com.nuxtnative.dev'
        minSdk 26
        targetSdk 36
        versionCode 2
        versionName '0.1.4'
    }
    sourceSets {
        main {
            java.srcDirs = ['../../../android/app/src/main/java', 'src/main/java']
            res.srcDirs = ['../../../android/app/src/main/res']
        }
    }
}

dependencies {
    implementation(name: 'quickjs-android-0.9.2', ext: 'aar')
    implementation 'androidx.core:core:1.12.0'
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'
}
