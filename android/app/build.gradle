apply plugin: 'com.android.application'

android {
    namespace 'com.nuxtnative.prototype'
    compileSdk 36

    defaultConfig {
        applicationId 'com.nuxtnative.prototype'
        minSdk 26
        targetSdk 36
        versionCode 1
        versionName '0.1.0'
    }

    signingConfigs {
        release {
            def storeFilePath = System.getenv('NUXT_NATIVE_RELEASE_STORE_FILE')
            def storePasswordValue = System.getenv('NUXT_NATIVE_RELEASE_STORE_PASSWORD')
            def keyAliasValue = System.getenv('NUXT_NATIVE_RELEASE_KEY_ALIAS')
            def keyPasswordValue = System.getenv('NUXT_NATIVE_RELEASE_KEY_PASSWORD')
            if (storeFilePath && storePasswordValue && keyAliasValue && keyPasswordValue) {
                storeFile file(storeFilePath)
                storePassword storePasswordValue
                keyAlias keyAliasValue
                keyPassword keyPasswordValue
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            if (System.getenv('NUXT_NATIVE_RELEASE_STORE_FILE') && System.getenv('NUXT_NATIVE_RELEASE_STORE_PASSWORD') && System.getenv('NUXT_NATIVE_RELEASE_KEY_ALIAS') && System.getenv('NUXT_NATIVE_RELEASE_KEY_PASSWORD')) {
                signingConfig signingConfigs.release
            }
        }
    }
}

dependencies {
    implementation(name: 'quickjs-android-0.9.2', ext: 'aar')
}
